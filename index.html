<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coco Crazy — помощник для игры</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&family=Rubik:wght@700;900&display=swap">
<style>
:root{--bg:#D4D6D9;--ink:#23262A;--muted:#52575D;--card:#fff;--line:#B4B8BD;--jungle:#B2B6BB;--on:#F6F1E3;--banana:#F7C948;
--head:"Rubik","Arial Black",sans-serif;--body:"Nunito","Segoe UI",Arial,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2B2D30;--ink:#ECEEF0;--muted:#B4B9BE;--card:#3A3D41;--line:#565A5F;--jungle:#1D1F22}}
:root[data-theme="dark"]{--bg:#2B2D30;--ink:#ECEEF0;--muted:#B4B9BE;--card:#3A3D41;--line:#565A5F;--jungle:#1D1F22}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:1.05rem/1.55 var(--body)}
h1,h2,h3{font-family:var(--head);margin:0;line-height:1.15}
:focus-visible{outline:3px solid var(--banana);outline-offset:3px}
.bar{background:var(--jungle);color:var(--ink);padding:12px 16px}
.bar div{max-width:640px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:8px}
.bar h1{font-size:1.4rem;font-weight:900}
.app{max-width:640px;margin:0 auto;padding:16px 16px 40px}
.btn{font:800 1.05rem var(--body);background:var(--banana);color:#2B1D12;border:0;border-radius:999px;padding:12px 24px;cursor:pointer;box-shadow:0 4px 0 #B88F14}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #B88F14}
.btn:disabled{opacity:.45;cursor:default}
.btn.full{width:100%;padding:16px;font-size:1.2rem}
.btn.ghost{background:transparent;color:inherit;border:2px solid currentColor;box-shadow:none;padding:6px 14px;font-size:.92rem}
.panel .btn.ghost{color:var(--ink);border-color:var(--line)}
.panel{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:22px;margin-top:16px}
.panel p{margin:8px 0 16px;color:var(--muted)}
.score{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.score li{display:grid;grid-template-columns:1fr auto 3.2em;gap:10px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 12px}
.score li.cur{border-color:var(--banana);box-shadow:0 0 0 2px var(--banana)}
.pn{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dots{display:flex;gap:4px}
.dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--c);background:transparent}
.dots i.on{background:var(--c)}
.score b{text-align:right}
.turn{font-size:1.3rem;font-weight:800;margin:0}
.res{display:flex;align-items:center;gap:14px}
.face{width:88px;height:88px;border-radius:22px;background:#FFFDF6;border:3px solid #3A2A22;display:grid;place-items:center;font-size:3rem;box-shadow:0 5px 0 rgba(0,0,0,.28);flex:none}
.face img{width:76%;height:76%;object-fit:contain;pointer-events:none}
.opt img{width:32px;height:32px;flex:none}
.face.big{width:120px;height:120px;font-size:4rem;margin:8px auto 16px}
.res h2{font-size:1.7rem;font-weight:900}
.picks{display:flex;gap:10px;margin:0 0 12px}
.picks button,.opt{font:800 1.05rem var(--body);display:flex;align-items:center;gap:10px;background:transparent;color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;text-align:left}
.picks button:disabled{opacity:.35;cursor:default}
.vb{flex:1;height:96px;padding:0;border-radius:22px;background:#FFFDF6;border:3px solid #3A2A22;box-shadow:0 5px 0 rgba(0,0,0,.28);cursor:pointer;display:grid;place-items:center}
.vb svg{width:56px;height:56px}
.vb:active{transform:translateY(2px)}
.opts.jr{display:flex;gap:12px}
.jt{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0;border:0;background:transparent;font:800 .9rem var(--body);color:var(--ink);cursor:pointer}
.jt span{display:grid;place-items:center;width:100%;max-width:88px;aspect-ratio:1;border-radius:22px;background:#FFFDF6;border:3px solid #3A2A22;box-shadow:0 5px 0 rgba(0,0,0,.28)}
.jt:active span{transform:translateY(2px)}
.jt img{width:76%;height:76%;pointer-events:none}
.picks button.c{flex:1 1 0;max-width:88px;aspect-ratio:1;padding:0;border-radius:22px;background:var(--c);border:3px solid #3A2A22;box-shadow:0 5px 0 rgba(0,0,0,.28);cursor:pointer}
.picks button.c:active{transform:translateY(2px)}
.opts{display:grid;gap:10px;margin-bottom:6px}
.row{display:flex;gap:10px;margin-top:16px}
.row .btn{flex:1}
.in{width:100%;font:inherit;padding:10px 14px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);margin-bottom:8px}
.stepper{display:flex;align-items:center;gap:16px;margin:8px 0 16px}
.stepper b{font:900 2rem var(--head);min-width:1.5em;text-align:center}
.stepper button{width:48px;height:48px;border-radius:50%;border:2px solid var(--line);background:transparent;color:var(--ink);font:800 1.5rem var(--body);cursor:pointer}
label.chk{display:flex;gap:10px;align-items:flex-start;margin:12px 0;cursor:pointer}
label.chk input{width:22px;height:22px;margin-top:3px;accent-color:var(--jungle)}
label.chk small{display:block;color:var(--muted)}
details{margin:12px 0;color:var(--muted)}
summary{cursor:pointer;font-weight:800;color:var(--ink)}
.win{text-align:center}
.win .face{margin:0 auto 12px}
.note{font-size:.92rem;color:var(--muted);margin:10px 0 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

var DICE=[{k:"peek",i:ICO.peek,t:"Все смотрят"},{k:"swapAll",i:ICO.swapAll,t:"Обмен"},{k:"rotate",i:ICO.rotate,t:"Поворот поля"},{k:"guess",i:ICO.guess,t:"Вопросительный знак"},{k:"joker",i:ICO.joker,t:"Обезьяний джокер"}];
var BAG=["peek","swapAll","rotate","guess","guess","joker"];
var rnd=function(){var k=BAG[Math.floor(Math.random()*6)];return DICE.filter(function(d){return d.k===k})[0]};
var KEY="coco-crazy-v1",S=null,hist=[],rolling=false,askNew=false,setup={n:4,names:[],pro:false};
var app=document.getElementById("app"),tools=document.getElementById("tools");
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function save(){try{localStorage.setItem(KEY,JSON.stringify({S:S,hist:hist}))}catch(e){}}
try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&o.S&&o.S.players&&o.S.players[0].got.length===COL.length){S=o.S;hist=o.hist||[]}}}catch(e){}
function snap(){hist.push(JSON.stringify(S));if(hist.length>40)hist.shift()}
function cnt(p){return p.got.reduce(function(a,b){return a+b},0)}
function die(){return DICE.filter(function(d){return d.k===S.die})[0]}

function drawSetup(){
  var n=setup.n,rows="";
  for(var i=0;i<n;i++)rows+='<input class="in" data-i="'+i+'" maxlength="16" placeholder="Игрок '+(i+1)+'" value="'+esc(setup.names[i]||"")+'" aria-label="Имя игрока '+(i+1)+'">';
  app.innerHTML='<div class="panel"><h2>Новая партия</h2><p>Кокосы и поле лежат на столе. Здесь вы бросаете кубик, ведёте счёт и следите за очерёдностью.</p>'+
  '<h3>Сколько игроков</h3><div class="stepper"><button data-act="dec" aria-label="Меньше">−</button><b>'+n+'</b><button data-act="inc" aria-label="Больше">+</button></div>'+rows+
  '<button class="btn ghost" data-act="order">Перемешать порядок ходов</button>'+
  '<label class="chk"><input type="checkbox" id="pro"'+(setup.pro?' checked':'')+'><span>Режим профи<small>Нельзя сразу называть цвет, который только что называли.</small></span></label>'+
  '<p class="note">Цель: собрать по одной обезьянке каждого из '+COL.length+' цветов.</p>'+
  '<details><summary>Что сделать на столе до старта</summary><p>Посадите в каждый кокос одну банду, то есть обезьянок одного цвета, закройте их и поставьте на поле. Перемешайте кокосы, пока никто не будет уверен, где какая банда. Затем каждый тайно заглядывает в любой кокос и возвращает его на место.</p></details>'+
  '<button class="btn full" data-act="start">Начать игру</button></div>';
  tools.innerHTML="";
}
function scoreHTML(){
  return '<ul class="score">'+S.players.map(function(p,i){
    var have=COL.filter(function(_,j){return p.got[j]}).map(function(k){return k.n}).join(", ")||"пока никого";
    return '<li class="'+(i===S.cur&&S.win===null?'cur':'')+'"><span class="pn">'+esc(p.name)+'</span><span class="dots" role="img" aria-label="Собрано: '+have+'">'+
    COL.map(function(k,j){return '<i class="'+(p.got[j]?'on':'')+'" style="--c:'+k.c+'"></i>'}).join("")+'</span><b>'+cnt(p)+'/'+S.target+'</b></li>'}).join("")+'</ul>';
}
function panel(){
  var P=S.players,cur=P[S.cur],n=P.length,d=S.die?die():null,h="";
  if(S.win!==null){
    return '<div class="panel win"><div class="face">🏆</div><h2>Победил '+esc(P[S.win].name)+'!</h2><p>Собрано '+S.target+' разноцветных обезьянок.</p><div class="row"><button class="btn" data-act="again">Ещё партия</button><button class="btn ghost" data-act="newask">Новые игроки</button></div></div>';
  }
  h+='<div class="panel"><p class="turn" style="margin:0 0 12px">Ходит '+esc(cur.name)+'</p>';
  if(!S.mode){
    h+='<div class="face big" id="face">'+ICO.joker+'</div><button class="btn full" data-act="roll">Бросить кубик</button>';
  }else{
    h+='<div class="res"><div class="face">'+d.i+'</div><h2>'+d.t+'</h2></div>';
    if(S.mode==="peek")h+='<p>Все одновременно берут по кокосу и заглядывают внутрь. Потом кокосы возвращаются на свои прежние места.</p><button class="btn full" data-act="next">Готово, следующий ход</button>';
    else if(S.mode==="peek1")h+='<p>Тайно загляните в любой кокос и поставьте его на место.</p><button class="btn full" data-act="next">Готово, следующий ход</button>';
    else if(S.mode==="swap1")h+='<p>Поменяйте местами два любых кокоса.</p><button class="btn full" data-act="next">Готово, следующий ход</button>';
    else if(S.mode==="rotate")h+='<p>Поверните игровое поле на 90° влево (четверть оборота).</p><button class="btn full" data-act="next">Готово, следующий ход</button>';
    else if(S.mode==="swapAll"){
      var ord=[];for(var q=0;q<n;q++)ord.push(esc(P[(S.cur+q)%n].name));
      h+='<p>Все по очереди быстро меняют местами по 2 кокоса. Начинает '+ord[0]+'. Порядок: '+ord.join(", ")+'.</p><button class="btn full" data-act="next">Готово, следующий ход</button>';
    }
    else if(S.mode==="joker")h+='<p>Выберите, что сделать:</p><div class="opts jr"><button class="jt" data-act="jk" data-v="swap1"><span>'+ICO.swapAll+'</span>Обмен</button><button class="jt" data-act="jk" data-v="peek1"><span>'+ICO.peek+'</span>Подсмотреть</button><button class="jt" data-act="jk" data-v="guess"><span>'+ICO.guess+'</span>Угадать</button></div>';
    else if(S.mode==="guess"){
      if(S.step===0){
        var av=COL.filter(function(k,j){return !cur.got[j]&&!(S.pro&&S.last===j)}).length;
        if(!av)h+='<p>Нет доступных цветов для угадывания.</p><button class="btn full" data-act="next">Пропустить ход</button>';else h+='<p>Ткните в любой кокос, назовите цвет вслух и выберите его здесь. Цвета, которые у вас уже есть, недоступны.'+(S.pro&&S.last!==null?' Цвет, который только что называли, недоступен.':'')+'</p><div class="picks">'+
        COL.map(function(k,j){return '<button data-act="pick" data-v="'+j+'" style="--c:'+k.c+'"'+((cur.got[j]||(S.pro&&S.last===j))?' disabled':'')+' class="c" aria-label="'+k.n+'"></button>'}).join("")+'</div>';
      }else if(S.step===1){
        h+='<p>Вы назвали: <b>'+COL[S.pick].n+'</b>. Откройте кокос так, чтобы другие не видели. Угадали?</p><div class="row"><button class="vb" data-act="yes" aria-label="Угадал"><svg viewBox="0 0 64 64" fill="none" stroke="#2E9E4F" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 34l14 14 25-29"/></svg></button><button class="vb" data-act="no" aria-label="Не угадал"><svg viewBox="0 0 64 64" fill="none" stroke="#D8382F" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 16l32 32M48 16L16 48"/></svg></button></div>';
      }else h+='<p>'+S.msg+'</p><button class="btn full" data-act="next">Следующий ход</button>';
    }
  }
  return h+'</div>';
}
function drawGame(){
  app.innerHTML=scoreHTML()+panel()+(askNew?'<div class="panel"><p style="margin-top:0">Сбросить партию и начать с новыми игроками?</p><div class="row"><button class="btn" data-act="newyes">Да, сбросить</button><button class="btn ghost" data-act="newno">Отмена</button></div></div>':'');
  tools.innerHTML='<button class="btn ghost" data-act="undo"'+(hist.length?'':' disabled')+'>Отменить ход</button> <button class="btn ghost" data-act="newask">Новая игра</button>';
}
function draw(){save();if(S)drawGame();else drawSetup()}
function next(){snap();S.cur=(S.cur+1)%S.players.length;S.die=null;S.mode=null;S.step=0;S.pick=null;S.msg="";draw()}
function roll(){
  if(rolling)return;rolling=true;var f=document.getElementById("face"),k=0;
  var t=setInterval(function(){f.innerHTML=rnd().i;
    if(++k>=8){clearInterval(t);var d=rnd();snap();S.die=d.k;S.mode=d.k;S.step=0;rolling=false;draw()}},70);
}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
document.addEventListener("input",function(e){
  var i=e.target.getAttribute&&e.target.getAttribute("data-i");if(i!==null&&i!==undefined)setup.names[+i]=e.target.value;
  if(e.target.id==="pro")setup.pro=e.target.checked;
});
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b)return;var a=b.getAttribute("data-act"),v=b.getAttribute("data-v");
  if(a==="inc"){if(setup.n<8)setup.n++;drawSetup()}
  else if(a==="dec"){if(setup.n>2)setup.n--;drawSetup()}
  else if(a==="order"){var nm=[];for(var i=0;i<setup.n;i++)nm.push((setup.names[i]||"").trim()||"Игрок "+(i+1));setup.names=shuffle(nm);drawSetup()}
  else if(a==="start"){var P=[];for(var i=0;i<setup.n;i++)P.push({name:(setup.names[i]||"").trim()||"Игрок "+(i+1),got:COL.map(function(){return 0})});
    S={players:P,cur:0,target:COL.length,pro:setup.pro,last:null,die:null,mode:null,step:0,pick:null,msg:"",win:null};hist=[];askNew=false;draw()}
  else if(a==="roll")roll();
  else if(a==="next")next();
  else if(a==="swapnext"){if(S.step+1>=S.players.length)next();else{snap();S.step++;draw()}}
  else if(a==="jk"){snap();S.mode=v;S.step=0;draw()}
  else if(a==="pick"){snap();S.pick=+v;S.step=1;draw()}
  else if(a==="yes"||a==="no"){
    snap();var p=S.players[S.cur],c=S.pick;S.last=c;
    if(a==="no")S.msg="Не угадали, обезьянку не берёте. Поставьте кокос обратно на его клетку.";
    else if(p.got[c])S.msg="Верно, но такая обезьянка у вас уже есть, поэтому ничего не берёте. Поставьте кокос на место.";
    else{p.got[c]=1;S.msg="Верно! Возьмите из кокоса "+COL[c].a+" обезьянку и поставьте перед собой. Кокос верните на место.";if(cnt(p)>=S.target)S.win=S.cur}
    S.step=2;draw()}
  else if(a==="undo"){if(hist.length){S=JSON.parse(hist.pop());askNew=false;draw()}}
  else if(a==="again"){S.players.forEach(function(p){p.got=COL.map(function(){return 0})});S.cur=0;S.last=null;S.die=null;S.mode=null;S.step=0;S.win=null;hist=[];draw()}
  else if(a==="newask"){askNew=true;drawGame()}
  else if(a==="newno"){askNew=false;drawGame()}
  else if(a==="newyes"){S=null;hist=[];askNew=false;draw()}
});
draw();
})();
</script>
</body>
</html>
